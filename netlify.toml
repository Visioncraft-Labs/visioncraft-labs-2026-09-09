[build]
  command = "npm run build"
  publish = "dist"
[build.environment]
  NODE_VERSION = "22"
  PYTHON_VERSION = "3.13"
  SITE_URL = "https://visioncraft-labs.com"
  SITE_MODE = "preview"
[context.production.environment]
  SITE_MODE = "production"
  FORM_BACKEND = "netlify"
[context.deploy-preview.environment]
  SITE_MODE = "preview"
[context.branch-deploy.environment]
  SITE_MODE = "preview"
