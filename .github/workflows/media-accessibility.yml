name: Media accessibility
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  media-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: npm run build
      - run: python3 -m unittest discover -s tests
