name: Website accessibility and SEO
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  media-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Check private preview output
        run: npm run build
      - name: Check public production output
        env:
          SITE_MODE: production
          SITE_URL: https://visioncraft-labs.com
        run: npm run build
      - run: python3 -m unittest discover -s tests
